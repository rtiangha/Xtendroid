ext {
    compileSdk = 35
    compileSdkVersion = 35
    minSdkVersion = 15
    buildToolsVersion = '35.0.1'

    android_gradle_ver = '8.10.0'

    xtext_plugin_version = '1.0.13' // local build: 'test'
    xtend_android_gradle_ver = xtext_plugin_version
    xtext_gradle_ver = xtext_plugin_version

    xtend_lib_ver = '2.10.0'
    android_sdk_support_ver = '35.0.1'

    build = [
        android_gradle : "com.android.tools.build:gradle:${android_gradle_ver}",
        xtend_android_gradle : "org.xtext:xtext-android-gradle-plugin:${xtend_android_gradle_ver}",
        xtext_gradle : "org.xtext:xtext-gradle-plugin:${xtext_gradle_ver}"
    ]

    lib = [
        xtend : "org.eclipse.xtend:org.eclipse.xtend.lib:${xtend_lib_ver}",
        android : [
                support_v4 : "androidx.legacy:legacy-support-v4:1.0.0",
                appcompat_v7 : "androidx.appcompat:appcompat:1.7.0"
        ]
    ]
}

